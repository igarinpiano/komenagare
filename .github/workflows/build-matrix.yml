# komenagare をリリースする全部のターゲット向けにビルドし、bin-<target> という名前のアーティファクトに置く。
# release.yml と build-check.yml から使う。ターゲットを足したり変えたりするのはここだけ。
#
# - macOS と Windows は、それぞれのランナーでそのままビルドする。
# - Linux・Android・BSD などは cross（cross-rs）でビルドする。イメージに各ターゲットの C のツール
#   （ring が使う）と古い glibc が入っている。`cross: true` はリリース版の cross（古い glibc で
#   リンクする）、`cross: git` は main の cross（リリース版でビルドできないターゲットだけに使う。
#   イメージの glibc が新しいので、ほかには使わない）。
# - x86_64 / aarch64 の Linux（gnu）は glibc 2.28（RHEL 8 / Debian 10）でも動くことを確かめる。
# - どれか1つでも失敗したら止まり、何も公開しない。最後の complete で全部そろったかを確かめる。
#   出さないターゲットは、表から消す。
# - 配布物のファイル名は komenagare-<target>.tar.gz（Windows は .zip）。komenagare update は
#   cli/build.rs が埋め込んだ自分の target で取るので、名前を変えるときはそちらも合わせる。
name: build-matrix

on:
  workflow_call:
    inputs:
      ref:
        description: ビルドするコミット（空なら呼び出し元のもの）
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # ── 主なもの ─────────────────────────────────────────────
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          # ── Windows / macOS のほかの種類 ─────────────────────────
          - { target: i686-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-pc-windows-gnu, os: windows-latest }
          - { target: universal-apple-darwin, os: macos-latest, universal: true }
          # ── Linux のほかの CPU ───────────────────────────────────
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, cross: true }
          - { target: arm-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true }
          - { target: arm-unknown-linux-musleabihf, os: ubuntu-latest, cross: true }
          - { target: riscv64gc-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: powerpc64le-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: s390x-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: loongarch64-unknown-linux-gnu, os: ubuntu-latest, cross: git }
          # ── Android（Termux）と BSD など ─────────────────────────
          - { target: aarch64-linux-android, os: ubuntu-latest, cross: git }
          - { target: armv7-linux-androideabi, os: ubuntu-latest, cross: git }
          - { target: x86_64-linux-android, os: ubuntu-latest, cross: git }
          - { target: i686-linux-android, os: ubuntu-latest, cross: git }
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest, cross: true }
          - { target: x86_64-unknown-netbsd, os: ubuntu-latest, cross: git }
          - { target: x86_64-unknown-illumos, os: ubuntu-latest, cross: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # （表の値はスクリプトに直接書き込まず、環境変数で渡す）
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Rust（stable）を入れる
        env:
          RUST_TARGETS: ${{ matrix.universal && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$RUST_TARGETS"
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: cross を入れる（リリース版）
        if: matrix.cross == true
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cross
      - name: cross を入れる（git）
        if: matrix.cross == 'git'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked --force
      - name: ビルド（そのまま）
        if: ${{ !matrix.cross && !matrix.universal }}
        run: |
          # Windows は Visual C++ ランタイムを入れていない PC でも動くよう静的リンクする
          if [[ "$TARGET" == *windows-msvc ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked -p komenagare --target "$TARGET"
      - name: ビルド（cross）
        if: matrix.cross
        run: cross build --release --locked -p komenagare --target "$TARGET"
      - name: ビルド（macOS universal）
        if: matrix.universal
        env:
          # komenagare update が universal 版を取るように
          KOMENAGARE_TARGET: universal-apple-darwin
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p komenagare --target "$t"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/komenagare \
            target/aarch64-apple-darwin/release/komenagare target/x86_64-apple-darwin/release/komenagare
          lipo -info target/universal-apple-darwin/release/komenagare
      - name: glibc の版を確かめる
        if: contains(matrix.target, '-linux-gnu')
        env:
          MAX_GLIBC: ${{ matrix.glibc }}
        run: |
          bin="target/$TARGET/release/komenagare"
          need="$(readelf -V --wide "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "$TARGET が必要とする glibc: ${need:-なし}"
          if [ -n "$MAX_GLIBC" ] && [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::$TARGET が GLIBC_$need を必要とします（$MAX_GLIBC まで）"
            exit 1
          fi
      - name: 動かしてみる
        if: ${{ !matrix.cross }}
        run: |
          exe=komenagare; [[ "$TARGET" == *windows* ]] && exe=komenagare.exe
          "target/$TARGET/release/$exe" --version
          # 配布物の種類が埋め込まれ、GitHub のリリースに届くこと
          "target/$TARGET/release/$exe" update --check
      - name: 集める
        run: |
          mkdir -p "out/$TARGET"
          exe=komenagare; [[ "$TARGET" == *windows* ]] && exe=komenagare.exe
          cp "target/$TARGET/release/$exe" "out/$TARGET/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out/

  # 上の表のターゲットが全部そろったか（失敗で止まったときは、足りないものを並べる）
  complete:
    name: 全部のターゲットがそろったか
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # （動いているワークフローの表。ビルドするコミットのものではなく、このファイルのもの）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/build-matrix.yml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: ビルドできたものと表を比べる
        run: |
          wanted="$(grep -oE '\{ target: [A-Za-z0-9_-]+' .github/workflows/build-matrix.yml | awk '{print $3}' | sort -u)"
          built="$(ls binaries 2> /dev/null | sort -u)"
          missing="$(comm -23 <(echo "$wanted") <(echo "$built"))"
          echo "$(echo "$wanted" | grep -c .) 個のうち $(echo "$built" | grep -c .) 個ビルドできました"
          [ -z "$missing" ] && exit 0
          for t in $missing; do echo "::error::ビルドできていません: $t"; done
          echo "::error::ターゲットが欠けたままでは公開しません。ビルドを直すか、表から外してください"
          exit 1
