# GitHub Pages に公開する（Web アプリと install.sh など、リポジトリのファイル）。
# Web アプリには署名（web.sums と web.sums.minisig）を付ける。komenagare（CLI）は署名が合う Web アプリだけを
# 取ってきて配信する（cli/src/web.rs）。署名は environment「signing」の秘密鍵で行い、承認しないと動かないので、
# main に push できるだけでは、ホストが配信する Web アプリ（--remote ではコマンドを打てる）を差し替えられない。
#
# 使うには、リポジトリの Settings → Pages の Source を「GitHub Actions」にする。
# README などだけを変えたときは公開し直さない（paths）。手動でも動かせる。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - lib/**
      - web.json
      - install.sh
      - install.ps1
      - cli/minisign.pub
      - .github/minisign.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 秘密鍵に触るのはこの小さなジョブだけにする
  sign:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 署名の道具を入れる
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q cryptography==50.0.2
      - name: 署名する
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          py="$RUNNER_TEMP/venv/bin/python"
          protocol="$(python3 -c 'import json; print(json.load(open("web.json"))["protocol"])')"
          # 時刻はコミットのもの（同じコミットを公開し直しても同じ。CLI は手元の控えより古い署名には戻さない）
          comment="komenagare-web protocol:$protocol time:$(git log -1 --format=%ct)"
          "$py" .github/minisign.py web-sums .
          "$py" .github/minisign.py sign web.sums "$comment"
          # CLI に埋め込んだ公開鍵（cli/minisign.pub）で確かめられるか（鍵が合っていなければ公開しない）
          "$py" .github/minisign.py verify web.sums cli/minisign.pub "$comment"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-signature
          path: |
            web.sums
            web.sums.minisig

  deploy:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-signature
          path: signature
      - name: 公開するファイルを集める
        run: |
          mkdir _site
          # リポジトリのファイル（今までの「ブランチから公開」と同じ URL で取れるように）。.github は除く
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          cp signature/web.sums signature/web.sums.minisig _site/
          # 署名した中身と、公開するファイルが同じか
          (cd _site && sha256sum --check --strict --quiet web.sums)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
