# cli/Cargo.toml の version のリリースを作る。各 OS 向けにビルドしてリリースに載せる
# （install.sh / install.ps1 と komenagare update がここから取る。ファイル名は cli/src/update.rs と合わせる）
#
# 起動のしかた（どちらでもよい）
#   - Actions の画面（または API）から main で手動実行する。タグ（v0.1.1 など）はこのワークフローが作る
#     replace を付けると、同じ版のリリースとタグが別のコミットに既にあっても、ビルドが全部できてから消して作り直す
#   - version と同じ番号のタグを push する
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      replace:
        description: 同じ版のリリースとタグが別のコミットにあれば、消してこのコミットで作り直す
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: タグを決めて、作れるか確かめる
        id: tag
        shell: bash
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          v=$(grep -m1 '^version' cli/Cargo.toml | cut -d '"' -f 2)
          tag="v$v"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "main で実行してください（今は $GITHUB_REF）"; exit 1; }
            # タグは最後にリリースを作るときに作る（同じコミットのタグがあれば、途中で失敗したリリースの続きとして進める）
            if git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null \
              && [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              if [ "$REPLACE" = true ]; then
                echo "タグ $tag は別のコミットにあります。ビルドが全部できたら、リリースとタグを消して作り直します"
              else
                echo "タグ $tag は別のコミットに既にあります。cli/Cargo.toml の version を上げるか、replace を付けて実行してください"
                exit 1
              fi
            fi
          else
            [ "$tag" = "$GITHUB_REF_NAME" ] || { echo "タグ $GITHUB_REF_NAME と cli/Cargo.toml の version $v が違います"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: ビルド
        shell: bash
        run: |
          # musl 向けは C の部分（rustls が使う ring）を musl-gcc でビルドする
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then export "CC_${MT//-/_}=musl-gcc"; fi
          # Windows は Visual C++ ランタイムを入れていない PC でも動くよう静的リンクする
          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
        env:
          MT: ${{ matrix.target }}
      - name: まとめる
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=komenagare-${{ matrix.target }}
          mkdir dist
          cp cli/target/${{ matrix.target }}/release/komenagare LICENSE README.md dist/
          tar -czf $name.tar.gz -C dist .
          if command -v sha256sum >/dev/null; then sha256sum $name.tar.gz > $name.tar.gz.sha256; else shasum -a 256 $name.tar.gz > $name.tar.gz.sha256; fi
      - name: まとめる（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "komenagare-${{ matrix.target }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item cli/target/${{ matrix.target }}/release/komenagare.exe, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii -Path "$name.zip.sha256" -Value "$hash  $name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: komenagare-${{ matrix.target }}
          path: komenagare-${{ matrix.target }}.*

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          REPLACE: ${{ inputs.replace }}
        run: |
          repo="$GITHUB_REPOSITORY"
          # 今のタグのコミット（タグが無ければ空）
          cur=$(gh api "repos/$repo/commits/$TAG" --jq .sha 2>/dev/null) || cur=
          [[ "$cur" =~ ^[0-9a-f]{40}$ ]] || cur=
          if [ -n "$cur" ] && [ "$cur" != "$GITHUB_SHA" ]; then
            [ "$REPLACE" = true ] || { echo "タグ $TAG は別のコミット（$cur）にあります"; exit 1; }
            echo "前の $TAG（$cur）のリリースとタグを消します"
            if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
              gh release delete "$TAG" --repo "$repo" --yes
            fi
            gh api -X DELETE "repos/$repo/git/refs/tags/$TAG"
          fi
          # やり直しでリリースが既にあれば、ファイルを置き換える
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$repo" --clobber
          else
            # タグが無ければこのコミットに作る（GITHUB_TOKEN で作ったタグではこのワークフローは起動し直さない）
            gh release create "$TAG" dist/* --repo "$repo" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
