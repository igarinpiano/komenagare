# cli/Cargo.toml の version のリリースを作る。全部のターゲット（build-matrix.yml）向けにビルドし、
# .github/package.sh でまとめてリリースに載せる（install.sh / install.ps1 と komenagare update がここから取る）
#
# SHA256SUMS には environment「signing」の秘密鍵で署名する（sign ジョブ。承認が要る）。
#
# 起動のしかた（どちらでもよい）
#   - Actions の画面（または API）から main で手動実行する。タグ（v0.1.1 など）はこのワークフローが作る
#   - version と同じ番号のタグを push する
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: タグを決める（手動実行なら作る）
        id: tag
        shell: bash
        run: |
          v=$(grep -m1 '^version' cli/Cargo.toml | cut -d '"' -f 2)
          tag="v$v"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "main で実行してください（今は $GITHUB_REF）"; exit 1; }
            if git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
              # 同じコミットのタグがあるなら、前回の続き（途中で失敗したリリースのやり直し）として進める
              [ "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" ] \
                || { echo "タグ $tag は別のコミットに既にあります。cli/Cargo.toml の version を上げてください"; exit 1; }
            else
              # GITHUB_TOKEN で push したタグではこのワークフローは起動し直さない
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          else
            [ "$tag" = "$GITHUB_REF_NAME" ] || { echo "タグ $GITHUB_REF_NAME と cli/Cargo.toml の version $v が違います"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/build-matrix.yml

  package:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about
      - name: 依存のライセンスの一覧を作る
        run: cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.html about.hbs
      - name: まとめる
        run: bash .github/package.sh binaries dist && ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # SHA256SUMS に署名する（komenagare update が確かめる）。秘密鍵は environment「signing」の secret にだけ置き、
  # 承認しないと動かない（main に push したりタグを付けたりできるだけでは署名できない）。
  # 秘密鍵に触るのはこの小さなジョブだけにする（ビルドやまとめる処理と同じジョブに置かない）
  sign:
    needs: [tag, package]
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/minisign.py
            cli/minisign.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: 署名の道具を入れる
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q cryptography==50.0.2
      - name: 署名する
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" .github/minisign.py sign dist/SHA256SUMS "komenagare-release tag:$TAG"
          # CLI に埋め込んだ公開鍵（cli/minisign.pub）で確かめられるか（鍵が合っていなければ公開しない）
          "$py" .github/minisign.py verify dist/SHA256SUMS cli/minisign.pub "komenagare-release tag:$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/SHA256SUMS.minisig

  release:
    needs: [tag, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          ls -l dist
          # 下書きで作ってファイルを全部載せてから公開する（Immutable releases では公開後は変えられない）。
          # やり直しで下書きが残っていれば、ファイルを置き換えてから公開する。公開済みのものは変えない
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ "$draft" = true ]; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -n "$draft" ]; then
            echo "::error::リリース $TAG は公開済みです。ファイルは置き換えません（直すときは cli/Cargo.toml の version を上げてください）"
            exit 1
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --draft
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
