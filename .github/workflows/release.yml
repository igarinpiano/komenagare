# cli/Cargo.toml の version のリリースを作る。各 OS 向けにビルドしてリリースに載せる
# （install.sh / install.ps1 と komenagare update がここから取る。ファイル名は cli/src/update.rs と合わせる）
#
# 起動のしかた（どちらでもよい）
#   - Actions の画面（または API）から main で手動実行する。タグ（v0.1.1 など）はこのワークフローが作る
#   - version と同じ番号のタグを push する
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: タグを決める（手動実行なら作る）
        id: tag
        shell: bash
        run: |
          v=$(grep -m1 '^version' cli/Cargo.toml | cut -d '"' -f 2)
          tag="v$v"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "main で実行してください（今は $GITHUB_REF）"; exit 1; }
            if git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
              # 同じコミットのタグがあるなら、前回の続き（途中で失敗したリリースのやり直し）として進める
              [ "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" ] \
                || { echo "タグ $tag は別のコミットに既にあります。cli/Cargo.toml の version を上げてください"; exit 1; }
            else
              # GITHUB_TOKEN で push したタグではこのワークフローは起動し直さない
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          else
            [ "$tag" = "$GITHUB_REF_NAME" ] || { echo "タグ $GITHUB_REF_NAME と cli/Cargo.toml の version $v が違います"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: ビルド
        shell: bash
        run: |
          # musl 向けは C の部分（rustls が使う ring）を musl-gcc でビルドする
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then export "CC_${MT//-/_}=musl-gcc"; fi
          # Windows は Visual C++ ランタイムを入れていない PC でも動くよう静的リンクする
          if [[ "${{ matrix.target }}" == *windows-msvc ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
        env:
          MT: ${{ matrix.target }}
      - name: まとめる
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=komenagare-${{ matrix.target }}
          mkdir dist
          cp cli/target/${{ matrix.target }}/release/komenagare LICENSE README.md dist/
          tar -czf $name.tar.gz -C dist .
          if command -v sha256sum >/dev/null; then sha256sum $name.tar.gz > $name.tar.gz.sha256; else shasum -a 256 $name.tar.gz > $name.tar.gz.sha256; fi
      - name: まとめる（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "komenagare-${{ matrix.target }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item cli/target/${{ matrix.target }}/release/komenagare.exe, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii -Path "$name.zip.sha256" -Value "$hash  $name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: komenagare-${{ matrix.target }}
          path: komenagare-${{ matrix.target }}.*

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          # やり直しでリリースが既にあれば、ファイルを置き換える
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
