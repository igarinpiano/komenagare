name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'tests/*.test.js'

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check --all
      - run: cargo test --locked --manifest-path cli/Cargo.toml
      - run: sh -n install.sh

  cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: install.ps1（irm | iex）と komenagare update を手元のミラーで確かめる
        shell: pwsh
        run: |
          cargo build --locked --manifest-path cli/Cargo.toml
          $v = 'v' + (Select-String -Path cli/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $name = 'komenagare-x86_64-pc-windows-msvc'
          $rel = "mirror/releases/download/$v"
          New-Item -ItemType Directory -Force pkg, $rel | Out-Null
          Copy-Item target/debug/komenagare.exe, LICENSE, README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "$rel/$name.zip"
          $hash = (Get-FileHash "$rel/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii -Path "$rel/$name.zip.sha256" -Value "$hash  $name.zip"
          Copy-Item install.ps1 mirror/
          # 文字コードの指定なしで配る（Windows PowerShell 5.1 が UTF-8 を Latin-1 として読む、いちばん厳しい場合）
          $serve = "$env:RUNNER_TEMP\serve.py"
          Set-Content -Path $serve -Value @(
            'import functools, http.server, sys'
            'class H(http.server.SimpleHTTPRequestHandler):'
            '    def guess_type(self, path): return "application/octet-stream"'
            'http.server.ThreadingHTTPServer(("127.0.0.1", 8799), functools.partial(H, directory=sys.argv[1])).serve_forever()'
          )
          $server = Start-Process python -ArgumentList $serve, 'mirror' -PassThru -NoNewWindow
          Start-Sleep 3
          try {
            $env:KOMENAGARE_DOWNLOAD_URL = "http://127.0.0.1:8799/releases/download/$v"
            $env:KOMENAGARE_INSTALL_DIR = "$env:RUNNER_TEMP\kbin"
            $env:KOMENAGARE_NO_MODIFY_PATH = '1'
            $exe = "$env:KOMENAGARE_INSTALL_DIR\komenagare.exe"
            # README と同じ irm | iex で入れる（Windows PowerShell 5.1、PowerShell 7 で入れ直し）。表示が化けていないことも確かめる
            $u = 'http://127.0.0.1:8799/install.ps1'
            foreach ($ps in 'powershell', 'pwsh') {
              $out = "$env:RUNNER_TEMP\install-$ps.txt"
              & $ps -NoProfile -Command "`$o = & { irm $u | iex } 6>&1 | Out-String; [IO.File]::WriteAllText('$out', `$o, [Text.Encoding]::UTF8)"
              if ($LASTEXITCODE) { throw "install.ps1（$ps）が失敗しました" }
              $text = Get-Content -Raw -Encoding utf8 $out
              $text
              if ($text -notmatch 'インストールしました') { throw "install.ps1（$ps）の表示が化けています" }
            }
            & $exe --version
            # 同じ版を入れ直して、実行中の exe の置き換えを確かめる
            $env:KOMENAGARE_RELEASES_URL = 'http://127.0.0.1:8799/releases'
            & $exe update --version $v
            if ($LASTEXITCODE) { throw 'komenagare update が失敗しました' }
            if (-not (Test-Path "$exe.old")) { throw '置き換えた古い exe がありません' }
            & $exe --version
            if (Test-Path "$exe.old") { throw '古い exe が次の起動で消えていません' }
          } finally {
            Stop-Process -Id $server.Id
          }
