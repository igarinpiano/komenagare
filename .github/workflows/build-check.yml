# リリースする全部のターゲットのビルドを、公開せずに確かめる。
# 依存やビルドの設定を変えた PR で自動で走る。Actions の画面から手動でも動かせる。
name: build-check

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - cli/Cargo.toml
      - cli/build.rs
      - about.toml
      - about.hbs
      - .github/package.sh
      - .github/workflows/build-matrix.yml
      - .github/workflows/build-check.yml
      - .github/workflows/release.yml
      - Cross.toml
  workflow_dispatch:
    inputs:
      ref:
        description: ビルドするタグやコミット（空なら上で選んだブランチ）
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-matrix.yml
    with:
      ref: ${{ inputs.ref }}

  package:
    name: まとめてみる
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about
      - name: 依存のライセンスの一覧を作る
        run: cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.html about.hbs
      - name: リリースと同じようにまとめる
        run: bash .github/package.sh binaries release && ls -l release
