[package]
name = "komenagare"
version = "0.1.1"
edition = "2021"
description = "コメナガレ（komenagare）を複数人で編集するためのホスト"
license = "Apache-2.0"
repository = "https://github.com/igarinpiano/komenagare"
publish = false

[[bin]]
name = "komenagare"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
mime_guess = "2"
rand = "0.9"
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
ttf-parser = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "net", "signal", "time"] }
flate2 = "1"
sha2 = "0.11"

# 自己アップデートで配布物を展開する（Windows は zip、それ以外は tar.gz）
[target.'cfg(not(windows))'.dependencies]
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
